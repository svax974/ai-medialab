# Release pipeline: a tag `vX.Y.Z` builds the desktop packages natively on each OS and attaches them to a DRAFT GitHub
# release (pre-release while the version is 0.x). Nothing is published until the draft is reviewed and released by hand.
#
#   macOS (Apple Silicon)  AI.MediaLab_<v>_aarch64.dmg
#   Windows x64            AI-MediaLab-<v>-win-x64.zip    (portable, cross-built from Linux with mingw-w64)
#   Linux x64              AI.MediaLab_<v>_amd64.AppImage and .deb
#
# Each job runs `scripts-local/publish.sh __build_target`, the same per-target chain as a local release (engine runtime
# without PyTorch, light sd.cpp variants, pruned back dependencies, licence collection and copyleft gate, `tauri build`).
# The version comes from the tag and must equal back/package.json.
#
# Released v0.1.0 and v0.1.1. The Windows and Linux packages were never run on their own hardware (see
# desktop/runtime/profiles.json).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z), must equal back/package.json"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, target: darwin-arm64, runner: macos-14 }
          # Windows is cross-built from Linux (mingw-w64): NTFS symlinks of the template break Node on a Windows runner
          - { name: windows-x64, target: win-x64, runner: ubuntu-22.04 }
          - { name: linux-x64, target: linux-x64, runner: ubuntu-22.04 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the version
        run: |
          v="${VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "invalid version: $VERSION"; exit 1; }
          pkg="$(node -p "require('./back/package.json').version")"
          [[ "$v" == "$pkg" ]] || { echo "tag $VERSION != back/package.json $pkg"; exit 1; }
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system libraries (Tauri, AppImage) and the Windows cross toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 15   # a stalled Ubuntu mirror hung this step for 27 min (v0.1.1); fail fast and re-run instead
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file mingw-w64 zip

      - name: Build the back and the front
        run: |
          PROJECT_ROOT="$PWD"
          source scripts/desktop/common.sh
          desktop_check_project
          build_web

      - name: Package (${{ matrix.target }})
        env:
          PYTHON: python3
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DESKTOP_SKIP_SDCPP_VARIANTS: cuda,rocm
          GITHUB_TOKEN: ${{ github.token }}   # avoids the anonymous GitHub API rate limit when fetching engine releases
        run: |
          mkdir -p desktop/dist
          scripts-local/publish.sh __build_target "${{ matrix.target }}" "$RELEASE_VERSION"

      - name: Checksums
        working-directory: desktop/dist
        run: |
          # GitHub turns spaces in asset names into dots: rename first so each .sha256 names the file as downloaded
          for f in *' '*; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            (shasum -a 256 "$f" 2>/dev/null || sha256sum "$f") > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ai-medialab-${{ matrix.name }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # a manual run only produces the build artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Cut the files over GitHub's 2 GiB asset limit
        working-directory: assets
        run: |
          limit=$((2 * 1024 * 1024 * 1024 - 1))
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            if [ "$(stat -c %s "$f")" -gt "$limit" ]; then
              split -b 1900m "$f" "$f.part-"
              rm "$f"
              echo "- \`$f\` was cut: download every \`$f.part-*\`, run \`cat $f.part-* > $f\` and check \`$f.sha256\`." >> ../split-notes.md
            fi
          done
          ls -la

      - name: Release notes
        run: |
          v="${VERSION#v}"
          {
            # The section of CHANGELOG.md for this version, if any
            awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
            echo
            echo "Packages are **not code-signed**: macOS shows a Gatekeeper warning (right-click → Open, or \`xattr -dr com.apple.quarantine \"/Applications/AI MediaLab.app\"\`), Windows shows SmartScreen (More info → Run anyway)."
            echo "Models and the GPU-specific engines are downloaded by the app on first use. Third-party licences are in the app's \`licenses/\` folder."
            if [ -f split-notes.md ]; then echo; cat split-notes.md; fi
          } > notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${VERSION#v}"
          prerelease=""; [[ "$v" == 0.* || "$v" == *-* ]] && prerelease="--prerelease"
          gh release create "v$v" assets/* --draft $prerelease --verify-tag \
            --title "AI MediaLab v$v" --notes-file notes.md
