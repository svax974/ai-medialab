<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chambre noire</title>
    <script>
      try {
        // Sombre par défaut, quel que soit le réglage du système ; le clair n'est qu'un choix explicite.
        document.documentElement.dataset.theme = localStorage.getItem("cn-theme") === "light" ? "light" : "dark";
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
