<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI MediaLab</title>
    <script>
      try {
        // Dark by default regardless of the system setting; light is an explicit choice only.
        document.documentElement.dataset.theme = localStorage.getItem("cn-theme") === "light" ? "light" : "dark";
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
