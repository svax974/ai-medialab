<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>AI MediaLab</title>
  <style>
    @font-face {
      font-family: "Instrument Serif";
      font-style: italic;
      font-weight: 400;
      src: url("fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
    }
    :root {
      --bg: #0d0b0a; --ink: #efe8e1; --muted: #8d827a; --faint: #5e5550;
      --line: #2f2826; --safe: #ff5b37; --danger: #ff6b6b; --surface: #191514;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
    body {
      display: grid; place-items: center; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
      background:
        radial-gradient(60% 50% at 50% 38%, rgb(255 91 55 / 0.10), transparent 70%),
        var(--bg);
    }
    main { width: min(560px, calc(100vw - 48px)); text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 22px; animation: breathe 2.6s ease-in-out infinite; }
    h1 {
      margin: 0; font: italic 400 clamp(40px, 7vw, 58px)/1 "Instrument Serif", Georgia, serif;
      letter-spacing: -0.01em;
    }
    .status {
      margin-top: 18px; min-height: 1.4em; color: var(--muted);
      font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .bar { width: 140px; height: 2px; margin: 18px auto 0; background: var(--line); overflow: hidden; border-radius: 2px; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: var(--safe);
      box-shadow: 0 0 12px var(--safe); animation: slide 1.5s ease-in-out infinite;
    }
    .error { display: none; margin-top: 26px; text-align: left; }
    body.failed .error { display: block; animation: rise .4s ease both; }
    body.failed .bar, body.failed .mark { display: none; }
    body.failed h1 { font-size: 40px; }
    .error h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--danger); }
    .error p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; line-height: 1.55; user-select: text; }
    .error pre {
      margin: 0; padding: 12px 14px; max-height: 38vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #c4b9af; user-select: text;
    }
    .error code { color: var(--ink); user-select: text; }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="10.5" fill="none" stroke="#ff5b37" stroke-width="3" />
      <circle cx="16" cy="16" r="3.5" fill="#ff5b37" />
    </svg>
    <h1>AI MediaLab</h1>
    <div class="status" id="status">Démarrage du moteur…</div>
    <div class="bar" aria-hidden="true"></div>
    <section class="error" id="error" role="alert">
      <h2 id="error-title"></h2>
      <p id="error-detail"></p>
      <pre id="error-log"></pre>
    </section>
  </main>
  <script>
    // Piloté par la coque (Rust) via webview.eval().
    window.cnSplash = {
      status(text) {
        document.body.classList.remove("failed");
        document.getElementById("status").textContent = text;
      },
      error(title, detail, log) {
        document.body.classList.add("failed");
        document.getElementById("status").textContent = "";
        document.getElementById("error-title").textContent = title;
        document.getElementById("error-detail").textContent = detail || "";
        const pre = document.getElementById("error-log");
        pre.textContent = log || "";
        pre.style.display = log ? "block" : "none";
      },
    };
  </script>
</body>
</html>
