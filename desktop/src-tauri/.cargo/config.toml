# Windows cross-compilation from macOS/Linux with mingw-w64 (brew install mingw-w64).
# Only used with --target x86_64-pc-windows-gnu; no effect on the macOS build.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
