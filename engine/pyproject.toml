[project]
name = "ai-medialab"
version = "0.1.0"
description = "AI MediaLab — studio local de création d'images et d'audio (backend)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stéphane Vaxelaire" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "huggingface_hub>=0.30",
    "psutil>=6.0",
    "numpy>=2.0",
    "soundfile>=0.12",  # read/write voice references and audio output
    "starlette>=0.39",  # HTTP Range on static files (video seeking)
    "av>=14",  # PyAV: decode uploaded videos, encode generated ones (H.264 + AAC); bundles FFmpeg, license: docs/components/ffmpeg.md
]

[project.optional-dependencies]
# Native Metal engine (Apple Silicon): mflux / MLX.
mlx = ["mflux==0.20.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# PyTorch + diffusers engine: NVIDIA (CUDA), AMD (ROCm), Apple (MPS). The torch build is picked by the
# runtime profile (see desktop/runtime/profiles.json), not here.
torch = [
    "torch>=2.4",
    "torchvision",  # needed by the Qwen3-VL image processor (transformers 5)
    "diffusers>=0.41",  # LTX-2.3 needs >= 0.38
    "gguf>=0.10",  # quantized (GGUF) transformers loaded by diffusers
    "transformers>=5.17",
    "accelerate>=1.0",
    "peft>=0.17",  # LoRA loading by diffusers (SDXL LoRAs)
    "sentencepiece",
    "protobuf",
    "safetensors",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
